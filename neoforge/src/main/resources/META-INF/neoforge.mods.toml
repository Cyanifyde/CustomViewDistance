[[mods]]
modId="playerviewdistance"
version="${version}"
displayName="Player View Distance"
authors="Cyanifyde and contributors"
description='''Server-only per-player chunk loading with exact overlap merging and adaptive off-thread planning.'''

[[mixins]]
config="playerviewdistance.mixins.json"

[[dependencies.playerviewdistance]]
