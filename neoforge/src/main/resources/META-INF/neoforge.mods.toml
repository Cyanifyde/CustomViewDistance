    type="required"
    versionRange="${neoforge_range}"
    ordering="NONE"
    side="SERVER"

[[dependencies.playerviewdistance]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_range}"
    ordering="NONE"
    side="SERVER"
