plugins {
    id 'net.fabricmc.fabric-loom'
    id 'maven-publish'
}

ext.pvdMinecraftVersion = providers.gradleProperty('pvdMc26Version').getOrElse('26.1')
ext.pvdArtifactMinecraftVersion = '26.1'
ext.pvdMinecraftDependency = '>=26.1 <=26.1.2'
ext.pvdFabricApiVersion = '0.145.1+26.1'
ext.pvdJavaVersion = 25
ext.pvdUseMojangMappings = false

apply from: rootProject.file('gradle/minecraft-module.gradle')
