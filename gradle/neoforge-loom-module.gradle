version = "${rootProject.version}+mc${pvdArtifactMinecraftVersion}"
group = rootProject.group

def stripFabricManifestAttributes = { java.nio.file.Path jarPath ->
    def temporary = jarPath.resolveSibling(jarPath.fileName.toString() + '.pvd-manifest.tmp')
    def input = new java.util.zip.ZipFile(jarPath.toFile())
    boolean written = false
    try {
        def output = new java.util.zip.ZipOutputStream(
                java.nio.file.Files.newOutputStream(temporary))
        try {
            def entries = input.entries()
            while (entries.hasMoreElements()) {
                def entry = entries.nextElement()
                byte[] bytes = input.getInputStream(entry).readAllBytes()
                if (entry.name == 'META-INF/MANIFEST.MF') {
                    def platformManifest = new java.util.jar.Manifest(
                            new ByteArrayInputStream(bytes))
                    platformManifest.mainAttributes.keySet()
                            .findAll { it.toString().startsWith('Fabric-') }
                            .each { platformManifest.mainAttributes.remove(it) }
                    def manifestBytes = new ByteArrayOutputStream()
                    platformManifest.write(manifestBytes)
                    bytes = manifestBytes.toByteArray()
                }
                def copy = new java.util.zip.ZipEntry(entry.name)
                copy.time = entry.time
                output.putNextEntry(copy)
                output.write(bytes)
                output.closeEntry()
            }
            written = true
        } finally {
            output.close()
        }
    } finally {
        input.close()
        if (!written) {
            java.nio.file.Files.deleteIfExists(temporary)
        }
    }
    java.nio.file.Files.move(
            temporary,
            jarPath,
            java.nio.file.StandardCopyOption.REPLACE_EXISTING)
}

base {
    archivesName = "${rootProject.providers.gradleProperty('archives_base_name').get()}-neoforge"
}

dependencies {
    implementation 'it.unimi.dsi:fastutil:8.5.16'
    implementation 'com.google.code.gson:gson:2.13.2'
    minecraft "com.mojang:minecraft:${pvdMinecraftVersion}"
    if (pvdUseMojangMappings) {
        mappings loom.officialMojangMappings()
    }

    // A classifier dependency avoids ModDev/NeoForm's whole-game transformation
    // pipeline.  Minecraft comes from Loom; these exact, non-transitive jars are
    // present only so javac can verify NeoForge's public event and loader APIs.
    compileOnly("net.neoforged:neoforge:${pvdNeoForgeVersion}:universal") {
        transitive = false
    }
    compileOnly("net.neoforged.fancymodloader:loader:${pvdFmlLoaderVersion}") {
        transitive = false
    }
    compileOnly("net.neoforged:bus:${pvdNeoForgeEventBusVersion}") {
        transitive = false
    }
    compileOnly 'net.fabricmc:sponge-mixin:0.15.5+mixin.0.8.7'
    compileOnly 'org.jspecify:jspecify:1.0.0'
}

sourceSets {
    main {
        java {
            srcDirs = [
                    rootProject.file('common/src/main/java'),
                    rootProject.file('src/main/java'),
                    rootProject.file('neoforge/src/main/java')
            ]
            exclude 'com/playerviewdistance/PlayerViewDistanceMod.java'
        }
        resources {
            srcDirs = [
                    rootProject.file('src/main/resources'),
                    rootProject.file('neoforge/src/main/resources')
            ]
            exclude 'fabric.mod.json'
        }
    }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_range', pvdMinecraftRange
    inputs.property 'neoforge_range', pvdNeoForgeRange
    inputs.property 'java_compatibility', "JAVA_${pvdJavaVersion}"
    inputs.property 'resource_pack_format', pvdResourcePackFormat

    filesMatching(['META-INF/neoforge.mods.toml', 'playerviewdistance.mixins.json', 'pack.mcmeta']) {
        expand(
                version: project.version,
                minecraft_range: pvdMinecraftRange,
                neoforge_range: pvdNeoForgeRange,
                java_compatibility: "JAVA_${pvdJavaVersion}",
                resource_pack_format: pvdResourcePackFormat
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = pvdJavaVersion as int
    options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(pvdJavaVersion as int)
    }
    sourceCompatibility = JavaVersion.toVersion(pvdJavaVersion)
    targetCompatibility = JavaVersion.toVersion(pvdJavaVersion)
}

tasks.named('jar', Jar) {
    if (pvdUseMojangMappings) {
        // The remapping Loom plugin normally treats the Mojang-named jar as a
        // development intermediate. NeoForge runs Mojang names, so that exact
        // jar is the production artifact and must keep the release filename.
        archiveClassifier = ''
        destinationDirectory = layout.buildDirectory.dir('libs')
    }
    doLast {
        def jarPath = archiveFile.get().asFile.toPath()
        stripFabricManifestAttributes(jarPath)
    }
}


if (pvdUseMojangMappings) {
    tasks.named('sourcesJar', Jar) {
        destinationDirectory = layout.buildDirectory.dir('libs')
    }
    tasks.named('remapJar') {
        enabled = false
    }
    tasks.named('remapSourcesJar') {
        enabled = false
    }
}

tasks.withType(AbstractArchiveTask).configureEach {
    reproducibleFileOrder = true
    preserveFileTimestamps = false
}
