pluginManagement {
    repositories {
        maven {
            name = 'Forge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'NeoForge'
            url = 'https://maven.neoforged.net/releases/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
    plugins {
        id 'net.fabricmc.fabric-loom' version '1.17.19'
        id 'net.fabricmc.fabric-loom-remap' version '1.17.19'
        id 'com.gradleup.shadow' version '9.6.1'
        id 'net.minecraftforge.gradle' version '7.0.23'
    }
}

rootProject.name = 'playerviewdistance'

include 'common'
include 'mc1.21.11'
include 'mc26.1'
include 'mc26.2'
include 'paper1.21.11'
include 'paper26.x'
include 'forge1.21.11'
include 'forge26.1'
include 'forge26.2'
include 'neoforge1.21.11'
include 'neoforge26.1'
include 'neoforge26.2'
